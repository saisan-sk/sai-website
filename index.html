<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="header.js"></script>
<title>Saisanthosh Selvakumar</title>
<style>
    @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&dsiplay=swap");
    :root{
      --bg: #060309;
      --ink: #F4ECFF;
      --ink-dim: #B9A9D8;
      --accent: #FF9E6D;
    }

      *{ box-sizing: border-box; }

      html, body{
        margin: 0;
        padding: 0;
        background: var(--bg);
      }

      .hero{
        position: relative;
        width: 100%;
        height: 100vh;
        min-height: 520px;
        max-height: 900px;
        overflow: hidden;
        background: #060309; /* just in case webGL doesn't work, recommended by ai check */
        isolation: isolate;
      }

      .hero canvas{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      
      /* CRT scanline effect plus vignette, had help with ai for this and hero::after */
      .hero::before{
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0,0,0,0.0) 0px,
          rgba(0,0,0,0.0) 2px,
          rgba(0,0,0,0.12) 3px,
          rgba(0,0,0,0.12) 4px
        );
        mix-blend-mode: multiply;
      }

      .hero::after{
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 100%);
      }

      .hero-content{
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 1.5rem;
        pointer-events: none;
      }

      .hero-name{
        font-family: "Georgia", serif;
        color: var(--ink);
        font-size: clamp(2.8rem, 9vw, 8.4rem);
        line-height: 0.8;
        margin: 0;
        letter-spacing: 0.01em;
        text-shadow:
          0 0 6px rgba(255, 158, 109, 0.55),
          0 0 22px rgba(140, 90, 255, 0.35),
          3px 3px 0 rgba(0,0,0,0.65);
      }

      .hero-tagline{
        font-family: "VT323", monospace;
        color: var(--ink-dim);
        font-size: clamp(1.1rem, 2.6vw, 1.7rem);
        margin: 1.1rem 0 0;
        letter-spacing: 0.04em;
        text-shadow: 0 0 8px rgba(140, 90, 255, 0.35), 2px 2px 0 rgba(0,0,0,0.6);
        max-width: 42ch;
      }

      .hero-caret{
        display: inline-block;
        width: 0.55em;
        margin-left: 0.15em;
        background: var(--accent);
        animation: blink 1.1s steps(1) infinite;
      }

      @keyframes blink{ /* ai helped here and in the scroll section */
        0%, 49%{ opacity: 1; }
        50%, 100%{ opacity: 0; }
      }

      .hero-scroll{
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        color: var(--ink-dim);
        font-family: "VT323", monospace;
        font-size: 1rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        opacity: 0.7;
      }

      @media (prefers-reduced-motion: reduce) {
        .hero-caret{ animation: none; opacity: 1;}
      }
</style>
</head>

<body class="hero" id="hero">
<nav class="navbar">
  <div class="logo">my brand</div>
    <ul class="nav-links">
    <li><a href="#home" class="active">Home</a></li>
    <li><a href="#services">Services</a></li>
    <li><a href="#portfolio">Portfolio</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

  <canvas id="glcanvas"></canvas>
  
  <div class="hero-content">
    <h1 class="hero-name">SAISANTHOSH<br>SELVAKUMAR</h1>
    <p class="hero-tagline">world is mine<span class="hero-caret">&nbsp;</span></p>
  </div>

  <div class="hero-scroll">scroll down</div>
</body>
</html>
